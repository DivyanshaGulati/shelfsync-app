name: shelfsync

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shelfsync}
      POSTGRES_DB: ${POSTGRES_DB:-shelfsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD in the root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shelfsync}:${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD in the root .env}@db:5432/${POSTGRES_DB:-shelfsync}
      JWT_SECRET: ${JWT_SECRET:?Set a private JWT_SECRET in the root .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health/db', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  caddy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      CADDY_SITE: ${CADDY_SITE:-:80}
    ports:
      - "${HTTP_BIND:-127.0.0.1:8080}:80"
      - "${HTTPS_BIND:-127.0.0.1:8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
